<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+CU+Guides&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
   
    <link rel="shortcut icon" href="assets/logotipo.svg" type="image/x-icon">
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="Styles/navbar.css">
    <link rel="stylesheet" href="Styles/resenario.css">
    <link rel="stylesheet" href="Styles/footer.css">

    <title>Creaciones Impresas</title>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/resenaForm.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="titulo">
            <img src="./assets/logo-navbar.png" alt="Creaciones Impresas">
            <h1> Creaciones-impresas </h1>
        </div>

        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <i class="bi bi-list"></i>
        </button>

        <div class="menu">
            <a href="index.html"> INICIO </a>
            <a href="catalogo.html"> CATALOGO </a>
            <a href="pedidos.html"> PEDIDOS </a>
        </div>
    </header>

    <section>
        <div class="resenario">
            <h1> Agregar una reseña </h1>

            <form id="form-resena" class="formulario" novalidate>
                <div class="input-group">
                    <label for="nombre-resena">Ingrese su nombre:</label>
                    <div class="campo">
                        <input id="nombre-resena" name="nombre" type="text" autocomplete="name" maxlength="60" placeholder="Rodolfo Rodriguez">
                        <p class="error" id="error-nombre-resena" hidden></p>
                    </div>
                </div>
                <div class="input-group">
                    <label for="comentario">Escriba su reseña:</label>
                    <div class="campo">
                        <input id="comentario" name="comentario" type="text" maxlength="300">
                        <p class="error" id="error-comentario" hidden></p>
                    </div>
                </div>
                <div class="input-calif">
                    <div class="input-group-calif">
                        <label for="calificacion">Calificacion:</label>
                        <div class="campo">
                            <input id="calificacion" name="calificacion" type="number" inputmode="numeric" min="1" max="5" step="1" placeholder="1 a 5">
                            <p class="error" id="error-calificacion" hidden></p>
                        </div>
                    </div>

                    <button class="btn-publicar" type="submit"> Publicar </button>
                </div>
                <p class="mensaje-exito" id="exito-resena" hidden>Reseña registrada correctamente.</p>
            </form>
        </div>
        
    </section>
    
    <footer class="footer">
        <img src="assets/logo-navbar.png" alt="">
        <div class="contacto">
            <i class="bi bi-whatsapp"></i>
            <a href="tel:+526141419299"> +52 614 141 9299 </a>
        </div>
        <div class="contacto">
            <i class="bi bi-facebook"></i>
            <a href="https://www.facebook.com/share/19JwxTmz5i/"> Creaciones Impresas </a>
        </div>
        <img src="assets/logo-navbar.png" alt="">
    </footer>
</body>
</html>
